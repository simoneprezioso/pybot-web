[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pybot"
version = "0.1.0"
description = "PyBot: a chatbot written in plain Python by a swarm of agents. No weights, no training, just rules."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
web = ["ddgs>=9,<10; python_version >= '3.10'"]

[project.urls]
Repository = "https://github.com/huggingface/pybot"

[project.scripts]
pybot = "pybot:main"

[tool.setuptools]
py-modules = ["pybot"]

[tool.setuptools.packages.find]
include = ["bot*"]
